<app-layout>
  <div class="flex h-screen bg-gray-50">
    <!-- Mobile Menu Overlay -->
    <div *ngIf="showMobileMenu" 
         (click)="showMobileMenu = false"
         class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"></div>

    <!-- Sidebar -->
    <div [class]="'sidebar shadow-sm border-r border-gray-200 flex flex-col z-30 transition-transform duration-300 ' + 
                  (showMobileMenu ? 'fixed inset-y-0 left-0 w-64 transform translate-x-0' : 
                   'fixed inset-y-0 left-0 w-64 transform -translate-x-full lg:relative lg:translate-x-0')">
      <!-- Header -->
      <div class="logo-section">
        <div class="logo">
          <img src="assets/icons/lucide/lucide/briefcase.svg" alt="Vendor Portal">
          <span>Vendor Portal</span>
        </div>
        <p class="text-xs text-gray-400 mt-1">
          <span *ngIf="currentUser?.firstName && currentUser?.lastName">
            {{currentUser?.firstName}} {{currentUser?.lastName}}
          </span>
          <span *ngIf="!currentUser?.firstName || !currentUser?.lastName">Loading...</span>
        </p>
      </div>

      <!-- Navigation Menu -->
      <nav class="nav-menu">
        <div *ngFor="let tab of getAvailableMenuItems()">
          <!-- Regular menu item -->
          <button
            *ngIf="!tab.hasSubmenu"
            (click)="setActiveTab(tab.id); showMobileMenu = false"
            [class]="'nav-item ' + 
              (activeTab === tab.id ? 'active' : '')">
            <img [src]="'assets/icons/lucide/lucide/' + tab.icon" [alt]="tab.label">
            <span>{{tab.label}}</span>
          </button>

          <!-- Finance Management menu with submenu -->
          <div *ngIf="tab.hasSubmenu">
            <!-- Main Finance Management button -->
            <button
              (click)="toggleFinanceManagementSubmenu(); showMobileMenu = false"
              [class]="'nav-item ' + 
                (showFinanceManagementSubmenu ? 'active' : '')">
              <img [src]="'assets/icons/lucide/lucide/' + tab.icon" [alt]="tab.label">
              <span>{{tab.label}}</span>
              <img 
                [src]="'assets/icons/lucide/lucide/' + (showFinanceManagementSubmenu ? 'chevron-up.svg' : 'chevron-down.svg')" 
                class="chevron-rotate" 
                [class.expanded]="showFinanceManagementSubmenu"
                [alt]="showFinanceManagementSubmenu ? 'Collapse' : 'Expand'">
            </button>

            <!-- Submenu items -->
            <div *ngIf="showFinanceManagementSubmenu" class="submenu-container">
              <button
                *ngFor="let submenuItem of tab.submenu"
                (click)="navigateToFinanceSubmenu(submenuItem.id); showMobileMenu = false"
                [class]="'submenu-item ' + 
                  (activeFinanceSubmenu === submenuItem.id ? 'active' : '')">
                <div class="submenu-dot"></div>
                <span>{{submenuItem.label}}</span>
              </button>
            </div>
          </div>
        </div>
      </nav>

      <!-- Stats Summary -->
      <div class="stats-section">
        <div class="space-y-2 sm:space-y-3">
          <div *ngFor="let stat of stats; trackBy: trackByStatTitle" class="stat-item">
            <div class="stat-content">
              <div [class]="'stat-icon ' + stat.bg">
                <img [src]="'assets/icons/lucide/lucide/' + stat.icon + '.svg'" [class]="'w-3 h-3 sm:w-4 sm:h-4 ' + stat.color" [alt]="stat.title">
              </div>
              <span class="stat-title">{{stat.title}}</span>
            </div>
            <span class="stat-value">{{stat.value}}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden relative z-10">
      <!-- Mobile Header -->
      <div class="lg:hidden bg-white border-b border-gray-200 px-4 py-3">
        <div class="flex items-center justify-between">
          <button
            (click)="showMobileMenu = true"
            class="mobile-menu-btn p-2 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg">
            <img src="assets/icons/lucide/lucide/list.svg" class="w-5 h-5" alt="Menu">
          </button>
          <h1 class="text-lg font-bold text-gray-900">Vendor Portal</h1>
          <div class="w-9"></div> <!-- Spacer for centering -->
        </div>
      </div>

      <!-- Content Area -->
      <div class="flex-1 overflow-y-auto">
        <!-- Overview Tab -->
        <app-vendor-overview 
          *ngIf="activeTab === 'overview'"
          [resources]="vendorResources"
          [requirements]="requirements"
          [applications]="vendorApplications"
          [stats]="stats">
        </app-vendor-overview>

        <!-- Resources Tab -->
        <app-vendor-resources 
          *ngIf="activeTab === 'resources' && !showMatchingRequirementsPage"
          [resources]="vendorResources"
          [isLoading]="resourcesPaginationState.isLoading"
          [paginationState]="resourcesPaginationState"
          (openResourceModal)="onOpenResourceModal()"
          (editResource)="handleEditResource($event)"
          (toggleResourceStatus)="handleToggleResourceStatus($event)"
          (pageChange)="onResourcesPageChange($event)"
          (applicationCountClick)="handleApplicationCountClick($event)"
          (matchingCountClick)="handleMatchingCountClick($event)">
        </app-vendor-resources>

        <!-- Matching Requirements Page -->
        <app-matching-requirements
          *ngIf="activeTab === 'resources' && showMatchingRequirementsPage"
          [resourceId]="selectedResourceId"
          (navigateBack)="onMatchingRequirementsBack()"
          (onApplyRequirement)="handleApplyRequirement($event)">
        </app-matching-requirements>

        <!-- Requirements Tab -->
        <app-vendor-requirements 
          *ngIf="activeTab === 'requirements' && !showBrowseRequirementsPage"
          [requirements]="requirements"
          [isLoading]="requirementsPaginationState.isLoading"
          [paginationState]="requirementsPaginationState"
          [resourceFilter]="currentRequirementsSearchParams?.resourceId || ''"
          (applyResources)="handleApplyResources($event)"
          (pageChange)="onRequirementsPageChange($event)"
          (sortChange)="onRequirementsSortChange($event)"
          (searchChange)="onRequirementsSearchChange($event)"
          (clearFilter)="handleClearRequirementsFilter()">
        </app-vendor-requirements>

        <!-- Browse Requirements Page -->
        <app-browse-requirements-page
          *ngIf="activeTab === 'requirements' && showBrowseRequirementsPage"
          [selectedRequirementId]="selectedRequirementId"
          (navigateBack)="onBrowseRequirementsBack()">
        </app-browse-requirements-page>

        <!-- Applications Tab -->
        <app-vendor-applications 
          *ngIf="activeTab === 'applications'"
          [applications]="vendorApplications"
          [isLoading]="applicationsPaginationState.isLoading"
          [paginationState]="applicationsPaginationState"
          [resourceFilter]="applicationsResourceFilter"
          (updateApplicationStatus)="handleUpdateApplicationStatus($event)"
          (viewApplicationHistory)="handleViewApplicationHistory($event)"
          (pageChange)="onApplicationsPageChange($event)"
          (clearFilter)="handleClearApplicationsFilter()">
        </app-vendor-applications>

        <!-- Skills Management Tab -->
        <app-vendor-skill-management 
          *ngIf="activeTab === 'skill-management'"
          [skills]="organizationSkills"
          [isLoading]="isLoading"
          (openAddSkillModal)="onOpenAddVendorSkillModal()"
          (skillDeleted)="onVendorSkillDeleted($event)">
        </app-vendor-skill-management>

        <!-- User Management Tab -->
        <app-vendor-user-management 
          *ngIf="activeTab === 'user-management'"
          [users]="organizationUsers"
          [isLoading]="isLoading"
          (openAddUserModal)="showAddUserModal = true"
          (toggleUserStatus)="handleToggleUserStatus($event)">
        </app-vendor-user-management>

        <!-- Invoice Management Tab -->
        <app-invoice-management 
          *ngIf="activeTab === 'invoice-management'">
        </app-invoice-management>

        <!-- SOW Approvals Tab -->
        <app-sow-approvals 
          *ngIf="activeTab === 'sow-approvals'">
        </app-sow-approvals>

        <!-- PO Approvals Tab -->
        <app-po-approvals 
          *ngIf="activeTab === 'po-approvals'">
        </app-po-approvals>

        <!-- Profile Tab -->
        <app-profile-dashboard 
          *ngIf="activeTab === 'profile'">
        </app-profile-dashboard>
      </div>
    </div>

    <!-- Resource Modal -->
    <app-resource-modal 
      *ngIf="showResourceModal" 
      [resourceToEdit]="resourceToEdit"
      (close)="onCloseResourceModal()">
    </app-resource-modal>

    <!-- Apply Resource Modal - Temporarily disabled due to interface changes -->
    <!-- <app-apply-resource-modal
      *ngIf="showApplyModal"
      [requirementId]="selectedRequirement?._id || ''"
      (close)="closeApplyModal()">
    </app-apply-resource-modal> -->

    <!-- Add User Modal -->
    <app-add-user-modal 
      *ngIf="showAddUserModal" 
      [userType]="'vendor'"
      (close)="showAddUserModal = false"
      (userAdded)="onUserAdded($event)">
    </app-add-user-modal>

    <!-- Add Skill Modal -->
    <app-add-skill-modal *ngIf="showAddSkillModal" (close)="showAddSkillModal = false"></app-add-skill-modal>

    <!-- Add Vendor Skill Modal -->
    <app-add-vendor-skill-modal 
      *ngIf="showAddVendorSkillModal" 
      [isOpen]="showAddVendorSkillModal"
      (closeModal)="onCloseAddVendorSkillModal()"
      (skillAdded)="onVendorSkillAdded($event)">
    </app-add-vendor-skill-modal>

    <!-- Apply Requirement Modal -->
    <app-apply-requirement-modal
      *ngIf="showApplyRequirementModal"
      [requirementId]="selectedRequirementId || ''"
      (close)="closeApplyRequirementModal()"
      (success)="onApplicationSuccess()">
    </app-apply-requirement-modal>

    <!-- Application History Modal -->
    <app-application-history-modal
      [hidden]="!showHistoryModal"
      [applicationId]="selectedApplicationId"
      [isVisible]="showHistoryModal"
      [isLoading]="isLoadingHistory"
      [history]="applicationHistory"
      [applicationDetails]="applicationDetails"
      (close)="closeHistoryModal()">
    </app-application-history-modal>
  </div>
</app-layout>
