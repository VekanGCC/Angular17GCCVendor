<div class="space-y-4 sm:space-y-6">
  <!-- Resources Table -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="overflow-auto">
      <ag-grid-angular 
        style="width: 100%; height: 450px;" 
        [rowData]="resources" 
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef" 
        class="ag-theme-alpine" 
        [pagination]="false" 
        [gridOptions]="gridOptions"
        [overlayNoRowsTemplate]="'<span>No resources found</span>'">
      </ag-grid-angular>
    </div>
    
    <!-- Loading State -->
    <div *ngIf="isLoading" class="p-4 text-center text-gray-500">
      <div class="flex items-center justify-center">
        <img src="assets/icons/lucide/lucide/loader.svg" alt="Loading" class="w-4 h-4 sm:w-5 sm:h-5 animate-spin mr-2">
        <span class="text-sm">Loading resources...</span>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading && resources.length === 0" class="p-4 text-center text-gray-500 text-sm">
      No resources found. Add your first resource to get started.
    </div>
    
    <!-- Pagination -->
    <app-pagination 
      *ngIf="paginationState.totalPages > 1"
      [paginationState]="paginationState"
      (pageChange)="onPageChange($event)">
    </app-pagination>
  </div>
</div>
