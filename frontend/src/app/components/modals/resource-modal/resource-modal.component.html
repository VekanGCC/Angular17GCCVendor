<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between p-6 border-b border-gray-200">
      <h2 class="text-xl font-semibold text-gray-900">{{ isEditMode ? 'Edit Resource' : 'Add New Resource' }}</h2>
      <button
        (click)="onClose()"
        class="text-gray-400 hover:text-gray-600 transition-colors">
        <img src="assets/icons/lucide/lucide/x.svg" alt="x" class="w-6 h-6" />
      </button>
    </div>

    <form [formGroup]="resourceForm" (ngSubmit)="onSubmit()" class="p-6 space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Resource Name *
          </label>
          <input
            type="text"
            formControlName="name"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="e.g., John Doe"
            required>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Category *
          </label>
          <select
            formControlName="category"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            required>
            <option value="">Select a category</option>
            <option *ngFor="let category of availableCategories" [value]="category._id">
              {{category.name}}
            </option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div formGroupName="experience">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Experience *
          </label>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <input
                type="number"
                formControlName="years"
                min="0"
                max="50"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder="Years"
                required>
            </div>
            <div>
              <select
                formControlName="level"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                required>
                <option value="junior">Junior</option>
                <option value="mid">Mid</option>
                <option value="senior">Senior</option>
                <option value="expert">Expert</option>
              </select>
            </div>
          </div>
        </div>

        <div formGroupName="rate">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Rate ($/hour) *
          </label>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <input
                type="number"
                formControlName="hourly"
                min="1"
                max="500"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                required>
            </div>
            <div>
              <select
                formControlName="currency"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div formGroupName="location">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Location
          </label>
          <div class="space-y-2">
            <input
              type="text"
              formControlName="city"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="City">
            <input
              type="text"
              formControlName="state"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="State">
            <input
              type="text"
              formControlName="country"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="Country">
            <div class="flex items-center">
              <input
                type="checkbox"
                formControlName="remote"
                class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
              <label class="ml-2 block text-sm text-gray-700">
                Remote Work Available
              </label>
            </div>
          </div>
        </div>

        <div formGroupName="availability">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Availability *
          </label>
          <div class="space-y-2">
            <select
              formControlName="status"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required>
              <option value="available">Available</option>
              <option value="partially_available">Partially Available</option>
              <option value="unavailable">Unavailable</option>
            </select>
            <input
              type="number"
              formControlName="hours_per_week"
              min="0"
              max="168"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="Hours per week">
            <input
              type="date"
              formControlName="start_date"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="Start date">
          </div>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Skills *
        </label>
        <div class="space-y-2" formArrayName="skills">
          <div *ngFor="let skill of skills.controls; let i = index" class="flex items-center space-x-2">
            <select
              [formControlName]="i"
              class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required>
              <option value="">Select a skill</option>
              <option *ngFor="let adminSkill of availableSkills" [value]="getSkillId(adminSkill)">
                {{adminSkill.name}}
              </option>
            </select>
            <button
              *ngIf="skills.length > 1"
              type="button"
              (click)="removeSkill(i)"
              class="p-2 text-red-600 hover:text-red-700 hover:bg-red-50 rounded-lg transition-colors">
              <img src="assets/icons/lucide/lucide/minus.svg" alt="minus" class="w-4 h-4" />
            </button>
          </div>
          <button
            type="button"
            (click)="addSkill()"
            class="flex items-center text-blue-600 hover:text-blue-700 text-sm font-medium">
            <img src="assets/icons/lucide/lucide/plus.svg" alt="plus" class="w-4 h-4 mr-1" />
            Add Skill
          </button>
        </div>
        <div *ngIf="availableSkills.length === 0" class="text-xs text-orange-600 mt-1">
          Loading skills...
        </div>
        <p class="text-xs text-gray-500 mt-1">
          Skills are managed by administrators. Contact admin to add new skills.
        </p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Description *
        </label>
        <textarea
          formControlName="description"
          rows="4"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Brief description of the resource's background and expertise..."
          required></textarea>
      </div>

      <!-- File Upload Section -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Attach Document (Optional)
        </label>
        <div class="space-y-3">
          <!-- File Input -->
          <div class="flex items-center justify-center w-full">
            <label 
              for="resource-file-upload" 
              class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors">
              <div class="flex flex-col items-center justify-center pt-5 pb-6">
                <img src="assets/icons/lucide/lucide/upload.svg" alt="upload" class="w-8 h-8 mb-2 text-gray-400" />
                <p class="mb-2 text-sm text-gray-500">
                  <span class="font-semibold">Click to upload</span> or drag and drop
                </p>
                <p class="text-xs text-gray-500">PDF or DOC files only (Max 5MB)</p>
              </div>
              <input 
                id="resource-file-upload" 
                type="file" 
                class="hidden" 
                accept=".pdf,.doc,.docx"
                (change)="onFileSelected($event)"
                #fileInput>
            </label>
          </div>

          <!-- Selected File Display -->
          <div *ngIf="selectedFile" class="flex items-center justify-between p-3 bg-green-50 border border-green-200 rounded-lg">
            <div class="flex items-center space-x-3">
              <img src="assets/icons/lucide/lucide/file-text.svg" alt="file" class="w-5 h-5 text-green-600" />
              <div>
                <p class="text-sm font-medium text-green-800">{{ selectedFile.name }}</p>
                <p class="text-xs text-green-600">{{ (selectedFile.size / 1024 / 1024).toFixed(2) }} MB</p>
              </div>
            </div>
            <button
              type="button"
              (click)="removeFile()"
              class="p-1 text-red-600 hover:text-red-700 hover:bg-red-50 rounded transition-colors">
              <img src="assets/icons/lucide/lucide/x.svg" alt="remove" class="w-4 h-4" />
            </button>
          </div>

          <!-- Error Message -->
          <div *ngIf="fileError" class="p-3 bg-red-50 border border-red-200 rounded-lg">
            <div class="flex items-center space-x-2">
              <img src="assets/icons/lucide/lucide/alert-circle.svg" alt="error" class="w-4 h-4 text-red-600" />
              <p class="text-sm text-red-800">{{ fileError }}</p>
            </div>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-end space-x-4 pt-6 border-t border-gray-200">
        <button
          type="button"
          (click)="onClose()"
          class="px-6 py-2 text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="!resourceForm.valid"
          class="px-6 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-lg hover:from-blue-700 hover:to-indigo-700 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
          {{ isEditMode ? 'Update Resource' : 'Add Resource' }}
        </button>
      </div>
    </form>
  </div>
</div>
