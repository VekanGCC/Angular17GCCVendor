<app-layout>
  <div class="flex h-screen bg-gray-50">
    <!-- Mobile Menu Button -->
    <div class="lg:hidden fixed top-20 left-4 z-50">
      <button
        (click)="toggleSidebar()"
        class="bg-white p-2 rounded-lg shadow-lg border border-gray-200 hover:bg-gray-50 transition-colors">
        <img 
          [src]="'assets/icons/lucide/lucide/' + (isSidebarOpen ? 'x' : 'menu') + '.svg'" 
          class="w-5 h-5 text-gray-600" 
          [alt]="isSidebarOpen ? 'Close menu' : 'Open menu'">
      </button>
    </div>

    <!-- Sidebar -->
    <div 
      [class]="'sidebar shadow-sm border-r border-gray-200 flex flex-col z-30 transition-all duration-300 ease-in-out ' + 
        (isSidebarOpen ? 'w-64 translate-x-0' : 'w-64 -translate-x-full') + 
        ' lg:translate-x-0 lg:relative fixed lg:static top-0 left-0 h-full z-40'">
      
      <!-- Header -->
      <div class="logo-section">
        <div class="logo">
          <img src="assets/icons/lucide/lucide/briefcase.svg" alt="Client Portal">
          <span>Client Portal</span>
        </div>
        <p class="text-xs text-gray-400 mt-1">{{currentUser?.firstName}} {{currentUser?.lastName}}</p>
      </div>

      <!-- Navigation Menu -->
      <nav class="nav-menu">
        <div *ngFor="let tab of getAvailableMenuItems()">
          <!-- Regular menu item -->
          <button
            *ngIf="!tab.hasSubmenu"
            (click)="setActiveTab(tab.id)"
            [class]="'nav-item ' + 
              (activeTab === tab.id ? 'active' : '')">
            <img [src]="'assets/icons/lucide/lucide/' + tab.icon" [alt]="tab.label">
            <span>{{tab.label}}</span>
          </button>

          <!-- Finance Management menu with submenu -->
          <div *ngIf="tab.hasSubmenu">
            <!-- Main Finance Management button -->
            <button
              (click)="toggleFinanceManagementSubmenu()"
              [class]="'nav-item ' + 
                (showFinanceManagementSubmenu ? 'active' : '')">
              <img [src]="'assets/icons/lucide/lucide/' + tab.icon" [alt]="tab.label">
              <span>{{tab.label}}</span>
              <img 
                [src]="'assets/icons/lucide/lucide/' + (showFinanceManagementSubmenu ? 'chevron-up.svg' : 'chevron-down.svg')" 
                class="chevron-rotate" 
                [class.expanded]="showFinanceManagementSubmenu"
                [alt]="showFinanceManagementSubmenu ? 'Collapse' : 'Expand'">
            </button>

            <!-- Submenu items -->
            <div *ngIf="showFinanceManagementSubmenu" class="submenu-container">
              <button
                *ngFor="let submenuItem of tab.submenu"
                (click)="navigateToFinanceSubmenu(submenuItem.id)"
                [class]="'submenu-item ' + 
                  (activeFinanceSubmenu === submenuItem.id ? 'active' : '')">
                <div class="submenu-dot"></div>
                <span>{{submenuItem.label}}</span>
              </button>
            </div>
          </div>
        </div>
      </nav>

      <!-- Stats Summary -->
      <div class="stats-section">
        <div class="space-y-2 lg:space-y-3">
          <div *ngFor="let stat of stats" class="stat-item">
            <div class="stat-content">
              <div [class]="'stat-icon ' + stat.bg">
                <img [src]="'assets/icons/lucide/lucide/' + stat.icon + '.svg'" [class]="'w-3 h-3 lg:w-4 lg:h-4 ' + stat.color" [alt]="stat.title">
              </div>
              <span class="stat-title">{{stat.title}}</span>
            </div>
            <span class="stat-value">{{stat.value}}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile Overlay -->
    <div 
      *ngIf="isSidebarOpen" 
      (click)="closeSidebar()"
      class="lg:hidden fixed inset-0 bg-black bg-opacity-50 z-30">
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden w-full lg:w-auto">
      <!-- Main Content Area -->
      <div class="flex-1 overflow-y-auto p-4 lg:p-6">
        <!-- Overview Tab -->
        <app-client-overview 
          *ngIf="activeTab === 'overview'"
          [resources]="resources"
          [requirements]="requirements"
          [applications]="clientApplications"
          [stats]="stats">
        </app-client-overview>

        <!-- Requirements Tab -->
        <app-client-requirements 
          *ngIf="activeTab === 'requirements'"
          [requirements]="clientRequirements"
          [isLoading]="requirementsPaginationState.isLoading"
          [paginationState]="requirementsPaginationState"
          (openRequirementModal)="openRequirementModal()"
          (openCloseRequirementModal)="openCloseRequirementModal($event)"
          (openEditRequirementModal)="openEditRequirementModal($event)"
          (pageChange)="onRequirementsPageChange($event)"
          (sortChange)="onRequirementsSortChange($event)"
          (viewApplications)="onViewApplications($event)"
          (viewMatchingResources)="onViewMatchingResources($event)">
        </app-client-requirements>

        <!-- Resources Tab -->
        <app-client-resources 
          *ngIf="activeTab === 'resources'"
          [resources]="resources"
          [isLoading]="resourcesPaginationState.isLoading"
          [paginationState]="resourcesPaginationState"
          (applyResources)="applyMultipleResources($event)"
          (sortChange)="onResourcesSortChange($event)"
          (pageChange)="onResourcesPageChange($event)"
          (searchChange)="onResourcesSearchChange($event)">
        </app-client-resources>

        <!-- Applications Tab -->
        <app-client-applications 
          *ngIf="activeTab === 'applications'"
          [applications]="clientApplications"
          [isLoading]="applicationsPaginationState.isLoading"
          [paginationState]="applicationsPaginationState"
          [currentFilter]="currentApplicationFilter"
          (updateApplicationStatus)="handleUpdateApplicationStatus($event)"
          (viewApplicationHistory)="handleViewApplicationHistory($event)"
          (viewApplicationDetails)="handleViewApplicationDetails($event)"
          (pageChange)="onApplicationsPageChange($event)"
          (sortChange)="onApplicationsSortChange($event)"
          (clearFilter)="onClearApplicationFilter()">
        </app-client-applications>

        <!-- User Management Tab -->
        <app-client-user-management 
          *ngIf="activeTab === 'user-management'"
          [users]="organizationUsers"
          [isLoading]="isLoading"
          (openAddUserModal)="showAddUserModal = true"
          (toggleUserStatus)="handleToggleUserStatus($event)">
        </app-client-user-management>

        <!-- Apply Resources Tab -->
        <app-apply-resources-page 
          *ngIf="activeTab === 'apply-resources'"
          [selectedResourceIds]="selectedResourceIds"
          (navigateBack)="navigateBackToBrowse()">
        </app-apply-resources-page>

        <!-- Matching Resources Tab -->
        <app-matching-resources 
          *ngIf="activeTab === 'matching-resources'"
          [requirementId]="currentRequirementId"
          (navigateBack)="navigateBackToRequirements()"
          (onApplyResource)="onApplyResourceFromMatching($event)">
        </app-matching-resources>

        <!-- SOW Management Tab -->
        <app-sow-management 
          *ngIf="activeTab === 'sow-management'">
        </app-sow-management>

        <!-- PO Management Tab -->
        <app-po-management 
          *ngIf="activeTab === 'po-management'">
        </app-po-management>

        <!-- Invoice Management Tab -->
        <app-invoice-management 
          *ngIf="activeTab === 'invoice-management'">
        </app-invoice-management>

        <!-- Payment Management Tab -->
        <app-payment-management 
          *ngIf="activeTab === 'payment-management'">
        </app-payment-management>
        
        <!-- Profile Tab -->
        <app-profile-dashboard 
          *ngIf="activeTab === 'profile'">
        </app-profile-dashboard>
      </div>
    </div>
  </div>

  <!-- Requirement Modal -->
  <app-requirement-modal 
    *ngIf="showRequirementModal" 
    (close)="showRequirementModal = false"
    (confirm)="handleRequirementCreated($event)">
  </app-requirement-modal>

  <!-- Close Requirement Modal -->
  <app-requirement-modal
    *ngIf="showCloseRequirementModal"
    [requirement]="requirementToClose"
    [mode]="'close'"
    (close)="closeCloseRequirementModal()"
    (confirm)="confirmCloseRequirement()">
  </app-requirement-modal>

  <!-- Edit Requirement Modal -->
  <app-requirement-modal
    *ngIf="showEditRequirementModal"
    [requirement]="requirementToEdit"
    [mode]="'edit'"
    (close)="closeEditRequirementModal()"
    (confirm)="handleRequirementUpdate($event)">
  </app-requirement-modal>

  <!-- Application History Modal -->
  <app-application-history-modal
    [hidden]="!showHistoryModal"
    [applicationId]="selectedApplicationId"
    [isVisible]="showHistoryModal"
    [isLoading]="isLoadingHistory"
    [history]="applicationHistory"
    (close)="closeHistoryModal()">
  </app-application-history-modal>

  <!-- Application Details Modal -->
  <app-application-details-modal
    *ngIf="showApplicationDetailsModal"
    [application]="selectedApplication"
    (closeModal)="closeApplicationDetailsModal()">
  </app-application-details-modal>

  <!-- Add User Modal -->
  <app-add-user-modal 
    *ngIf="showAddUserModal" 
    [userType]="'client'"
    (close)="showAddUserModal = false"
    (userAdded)="onUserAdded($event)">
  </app-add-user-modal>
</app-layout>
