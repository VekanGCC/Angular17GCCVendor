<div class="space-y-6">
  <!-- Resources List -->
  <div class="bg-white rounded-lg shadow">
    <div class="p-6">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-semibold text-gray-900">Browse Resources</h2>
        <div class="flex space-x-4">
          <div class="relative">
            <input 
              type="text" 
              placeholder="Search resources..." 
              class="w-64 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <img [src]="icons.search" class="absolute right-3 top-2.5 h-5 w-5 text-gray-400" alt="search">
          </div>
          <select 
            class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="">All Skills</option>
            <option value="frontend">Frontend</option>
            <option value="backend">Backend</option>
            <option value="fullstack">Full Stack</option>
          </select>
        </div>
      </div>

      <!-- Multi-select Actions -->
      <div *ngIf="showApplyButton" class="mb-4 p-4 bg-blue-50 border border-blue-200 rounded-lg">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-4">
            <span class="text-sm font-medium text-blue-900">
              {{ getSelectedCount() }} resource{{ getSelectedCount() !== 1 ? 's' : '' }} selected
            </span>
            <button 
              (click)="clearSelection()"
              class="text-sm text-blue-600 hover:text-blue-800 underline">
              Clear Selection
            </button>
          </div>
          <button 
            (click)="onApplySelectedResources()"
            class="inline-flex items-center px-4 py-2 border border-transparent rounded-md text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            Apply Selected Resources
          </button>
        </div>
      </div>

      <!-- Loading State -->
      <div *ngIf="isLoading" class="flex justify-center items-center py-8">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
      </div>

      <!-- No Resources State -->
      <div *ngIf="!isLoading && resources.length === 0" class="text-center py-8">
        <img [src]="'assets/icons/lucide/lucide/users.svg'" class="h-12 w-12 text-gray-400 mx-auto mb-4" alt="users">
        <h3 class="text-lg font-medium text-gray-900 mb-2">No Resources Found</h3>
        <p class="text-gray-500">Try adjusting your search criteria</p>
      </div>

      <!-- AG Grid -->
      <div *ngIf="!isLoading && resources.length > 0" class="ag-grid-container">
        <ag-grid-angular
          class="ag-theme-alpine w-full"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          [gridOptions]="gridOptions"
          [rowData]="resources"
          [domLayout]="'autoHeight'"
          [rowSelection]="'single'"
          [animateRows]="true"
          [enableCellTextSelection]="true"
          (cellClicked)="onCellClicked($event)"
          (gridReady)="onGridReady($event)"
          (sortChanged)="onSortChanged($event)">
        </ag-grid-angular>
      </div>

      <!-- Custom Pagination -->
      <div *ngIf="!isLoading && resources.length > 0">
        <app-pagination
          [paginationState]="paginationState"
          (pageChange)="onPageChange($event)">
        </app-pagination>
      </div>
    </div>
  </div>
</div>
